name = "BosonicLean"
version = "0.1.0"
keywords = ["math", "quantum", "gaussian"]
defaultTargets = ["BosonicLean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "BosonicLean"
moreLeanArgs = ["-j1"]

# The companion library GABMPS (Tjoa-Cirac, arXiv:2607.28753) is its own Lake package in
# GA-BMPS/, which requires BosonicLean and TNLean; BosonicLean does not depend on it or on TNLean
# (user, 6 Oct 2026).

# The sealed statements and their proofs (verify/); `lake comparator` reads both modules.
[[lean_lib]]
name = "Verify"
srcDir = "verify"
roots = ["Challenge", "Solution"]
